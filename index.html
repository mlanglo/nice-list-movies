<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nice List">
  <title>Nice List Movies</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="lights" id="lights" aria-hidden="true"></div>

  <header class="top">
    <div class="top-row">
      <h1>Nice List Movies</h1>
      <label class="yearpick" aria-label="Season year"><select id="year"></select></label>
    </div>
    <div class="top-row sub"><span id="progress"></span><span class="pbar" id="pbar"><i></i></span></div>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Main">
    <button data-tab="list"><span>📜</span>My List</button>
    <button data-tab="spin"><span>🎰</span>Spin</button>
    <button data-tab="discover"><span>🎁</span>Discover</button>
    <button data-tab="more"><span>⚙️</span>More</button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
